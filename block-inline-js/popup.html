<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>JS Policy Inspector</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>JavaScript Policy Inspector</h1>
  <p id="origin" class="origin">…</p>

  <fieldset id="modes">
    <legend>Policy for this site</legend>
    <label><input type="radio" name="mode" value="observe" /> Observe</label>
    <label><input type="radio" name="mode" value="firstPartyOnly" /> First-party only</label>
    <label><input type="radio" name="mode" value="noScripts" /> No scripts</label>
  </fieldset>

  <p id="summary" class="summary"></p>
  <p id="rule" class="rule"></p>

  <div class="actions">
    <button id="reload" type="button">Reload with policy</button>
    <button id="pause" type="button">Pause 10 min</button>
    <button id="allow-tab" type="button">Allow this tab</button>
  </div>
  <p id="pause-state" class="rule"></p>

  <fieldset>
    <legend>Allowed script origins on this site</legend>
    <form id="exc-form">
      <input id="exc-input" type="text" placeholder="https://cdn.example.com" autocomplete="off" />
      <button type="submit">Add</button>
    </form>
    <ul id="exc-list"></ul>
  </fieldset>

  <h2>Inventory</h2>
  <div id="inventory" class="counts"></div>

  <h2>Activity</h2>
  <ul id="activity" class="activity"><li class="muted">loading…</li></ul>
  <p id="activity-note" class="hint">Blocked entries come from live CSP violations; reload after changing policy.</p>

  <div class="io">
    <button id="export-btn" type="button">Export settings</button>
    <button id="import-btn" type="button">Import settings</button>
    <input id="import-file" type="file" accept=".json,application/json" hidden />
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
