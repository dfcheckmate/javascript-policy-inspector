<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Inline JS Blocker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>Inline JS Blocker</h1>
  <p id="origin" class="origin">…</p>
  <p id="state" class="state">checking…</p>
  <button id="toggle" type="button">Toggle</button>
  <p class="hint">
    Blocks inline &lt;script&gt;, javascript: URIs and inline event
    handlers on this site by appending a CSP response header.
    External scripts keep running.
  </p>
  <script type="module" src="popup.js"></script>
</body>
</html>
