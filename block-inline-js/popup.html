<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>JS Policy Inspector</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>JavaScript Policy Inspector</h1>
  <p id="origin" class="origin">…</p>

  <fieldset id="modes">
    <legend>Policy for this site</legend>
    <label><input type="radio" name="mode" value="observe" /> Observe</label>
    <label><input type="radio" name="mode" value="firstPartyOnly" /> First-party only</label>
    <label><input type="radio" name="mode" value="noScripts" /> No scripts</label>
  </fieldset>

  <p id="summary" class="summary"></p>
  <p id="rule" class="rule"></p>
  <button id="reload" type="button">Reload with policy</button>

  <h2>Inventory</h2>
  <div id="inventory" class="counts"></div>

  <h2>Activity</h2>
  <ul id="activity" class="activity"><li class="muted">loading…</li></ul>
  <p id="activity-note" class="hint">Blocked entries come from live CSP violations; reload after changing policy.</p>

  <script type="module" src="popup.js"></script>
</body>
</html>
